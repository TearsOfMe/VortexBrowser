version: '3.8'

services:
  vortexbrowse:
    build: .
    image: vortexbrowse-server:latest
    container_name: vortexbrowse
    restart: unless-stopped
    ports:
      - "7788:7788"
      - "9757:9757"
    # Chromium in Docker needs sufficient shared memory (/dev/shm)
    shm_size: '512m'
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - vortexbrowse_downloads:/app/downloads
      - vortexbrowse_profile:/home/vortex/.config/google-chrome

volumes:
  vortexbrowse_downloads:
  vortexbrowse_profile:
